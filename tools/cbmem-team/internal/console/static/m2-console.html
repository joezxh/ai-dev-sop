<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>cbmem-team · M2 控制台</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, system-ui, "PingFang SC", sans-serif;
         background: #fafbfc; color: #222; }
  header { display: flex; gap: 1rem; align-items: center; padding: 0.6rem 1rem;
           background: #1f2937; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  header a { color: #fff; text-decoration: none; padding: 0.3rem 0.7rem; border-radius: 4px; }
  header a:hover, header a.active { background: #374151; }
  main { max-width: 1280px; margin: 0 auto; padding: 1rem; }
  h1 { margin: 0 0 0.4rem; font-size: 1.3rem; }
  h2 { margin: 1.2rem 0 0.4rem; font-size: 1.05rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
          padding: 0.8rem 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid #f1f5f9; }
  th { background: #f3f4f6; font-weight: 600; }
  tr:hover { background: #fafbfc; cursor: pointer; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 9px;
           font-size: 11px; font-weight: 600; }
  .pill-A { background: #dbeafe; color: #1e40af; }
  .pill-B { background: #fef3c7; color: #92400e; }
  .pill-J { background: #ede9fe; color: #6b21a8; }
  .pill-active   { background: #d1fae5; color: #065f46; }
  .pill-published { background: #d1fae5; color: #065f46; }
  .pill-draft    { background: #f3f4f6; color: #374151; }
  .pill-deprecated { background: #fee2e2; color: #991b1b; }
  button { padding: 4px 12px; border: 1px solid #d1d5db; background: #fff;
           border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #f3f4f6; }
  button.primary { background: #2563eb; border-color: #1d4ed8; color: #fff; }
  button.danger  { background: #dc2626; border-color: #b91c1c; color: #fff; }
  input, select, textarea { padding: 4px 8px; border: 1px solid #d1d5db;
           border-radius: 4px; font-size: 13px; font-family: inherit; }
  textarea { width: 100%; min-height: 240px; font-family: ui-monospace, monospace; }
  .grid-2 { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
  pre.mermaid { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
                padding: 1rem; overflow: auto; }
  details { margin-top: 0.5rem; }
  summary { cursor: pointer; font-weight: 600; }
  .toast { position: fixed; right: 1rem; bottom: 1rem; padding: 0.6rem 1rem;
           background: #1f2937; color: #fff; border-radius: 6px; opacity: 0;
           transition: opacity 200ms; z-index: 10; }
  .toast.show { opacity: 0.95; }
  .toast.err { background: #991b1b; }
</style>
</head>
<body>
<header>
  <strong>cbmem-team · M2</strong>
  <a href="#/tools" data-route="/tools">工具目录</a>
  <a href="#/bps"   data-route="/bps">最佳实践</a>
  <a href="#/ratelimit" data-route="/ratelimit">限流配置</a>
  <span style="margin-left:auto;opacity:.7" id="status-pill">…</span>
</header>

<main id="app"><p style="opacity:.5">加载中…</p></main>

<div id="toast" class="toast"></div>

<script>
// ---- tiny client lib ----
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const api = async (path, opts={}) => {
  const r = await fetch(path, { credentials:'same-origin',
    headers:{'Content-Type':'application/json', ...(opts.headers||{})},
    ...opts });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};
const toast = (msg, kind='') => {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind;
  setTimeout(()=>t.className='toast', 2400);
};

// ---- router ----
const routes = {
  '/tools':     renderTools,
  '/bps':       renderBPs,
  '/bp':        renderBPDetail,
  '/ratelimit': renderRateLimit,
};
function go() {
  const path = location.hash.replace(/^#/, '') || '/tools';
  $$('header a').forEach(a => a.classList.toggle('active', a.dataset.route === path.split('/').slice(0,2).join('/')));
  const fn = routes[path.split('/').slice(0,2).join('/')] || renderTools;
  fn(path);
}
window.addEventListener('hashchange', go);

// ---- view: tool catalog ----
async function renderTools(path) {
  const params = new URLSearchParams(location.hash.split('?')[1]||'');
  const track = params.get('track') || '';
  const qs = track ? '?track='+encodeURIComponent(track) : '';
  $('#app').innerHTML = '<p>加载工具目录…</p>';
  const data = await api('/api/console/v2/tools' + qs);
  const tools = data.tools || [];
  $('#app').innerHTML = `
    <h1>工具目录 · ${tools.length} 项</h1>
    <div class="row">
      <button data-track="">全部</button>
      <button data-track="A">A · MemPalace</button>
      <button data-track="B">B · codebase-mem</button>
      <button data-track="J">J · Joint</button>
      <button data-route="/ratelimit" onclick="location.hash='/ratelimit'">限流编辑 →</button>
    </div>
    <table style="margin-top:0.8rem">
      <thead><tr><th>tool_id</th><th>轨道</th><th>类别</th><th>name</th><th>状态</th><th>priority</th></tr></thead>
      <tbody>
        ${tools.map(t=>`
          <tr onclick="location.hash='/ratelimit?tool='+encodeURIComponent('${t.tool_id}')">
            <td><code>${t.tool_id}</code></td>
            <td><span class="pill pill-${t.track}">${t.track}</span></td>
            <td>${t.category}</td>
            <td>${t.name}</td>
            <td><span class="pill pill-active">${t.status}</span></td>
            <td>${t.priority}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  $$('button[data-track]').forEach(b => b.onclick = () => {
    const t = b.dataset.track;
    location.hash = '/tools' + (t ? '?track=' + t : '');
  });
}

// ---- view: BP list ----
async function renderBPs(path) {
  $('#app').innerHTML = '<p>加载最佳实践…</p>';
  const data = await api('/api/console/v2/bps?all=1');
  const bps = data.bps || [];
  $('#app').innerHTML = `
    <h1>最佳实践 · ${bps.length} 项</h1>
    <button class="primary" onclick="newBP()">+ 新建 BP</button>
    <table style="margin-top:0.8rem">
      <thead><tr><th>id</th><th>轨道</th><th>类别</th><th>标题</th><th>状态</th><th>版本</th><th>updated</th></tr></thead>
      <tbody>
        ${bps.map(b=>`
          <tr onclick="location.hash='/bp/${b.id}'">
            <td><code>${b.id}</code></td>
            <td><span class="pill pill-${b.track}">${b.track}</span></td>
            <td>${b.category}</td>
            <td>${b.title}</td>
            <td><span class="pill pill-${b.status}">${b.status}</span></td>
            <td>v${b.version}</td>
            <td>${(b.updated_at||'').slice(0,16)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function newBP() {
  const title = prompt('标题 (≤80 字)?');
  if (!title) return;
  const category = prompt('类别 (naming|correlation|contribution|security|performance|collaboration)?', 'naming');
  if (!category) return;
  const track = prompt('轨道 (A|B|J)?', 'J');
  if (!track) return;
  const body = prompt('正文 (markdown)?', '## 场景\n\n## 操作步骤\n1.');
  try {
    const bp = await api('/api/console/v2/bps', { method:'POST', body: JSON.stringify({
      title, category, track, body,
      created_by: 'console',
    })});
    toast('已创建 ' + bp.id);
    location.hash = '/bp/' + bp.id;
  } catch (e) { toast('失败: '+e.message, 'err'); }
}

// ---- view: BP detail + graph ----
async function renderBPDetail(path) {
  const id = path.split('/')[2];
  if (!id) return renderBPs();
  $('#app').innerHTML = '<p>加载…</p>';
  const [bp, graph, versions] = await Promise.all([
    api('/api/console/v2/bps/' + id),
    api('/api/console/v2/bps/' + id + '/graph'),
    api('/api/console/v2/bps/' + id + '/versions').catch(()=>({versions:[]})),
  ]);
  $('#app').innerHTML = `
    <h1>${bp.title}</h1>
    <div class="row" style="gap:0.4rem">
      <span class="pill pill-${bp.track}">${bp.track}</span>
      <span class="pill pill-${bp.status}">${bp.status}</span>
      <span class="pill">v${bp.version}</span>
      <span class="pill">P ${bp.priority}</span>
    </div>
    <div class="grid-2" style="margin-top:1rem">
      <div class="card">
        <h2>正文（编辑后 PUT 触发新版本）</h2>
        <textarea id="bp-body">${(bp.body||'').replace(/</g,'&lt;')}</textarea>
        <div style="margin-top:0.6rem">
          <button class="primary" onclick="saveBP('${id}')">保存（body 改动 → 版本 +1）</button>
          <button onclick="publishBP('${id}')" ${bp.status==='published'?'disabled':''}>发布</button>
          <button class="danger" onclick="delBP('${id}')">删除 BP（重置限流）</button>
        </div>
        <h2 style="margin-top:1rem">关联</h2>
        <details><summary>工具 (${bp.tools.length})</summary>${bp.tools.map(t=>'<code>'+t+'</code>').join(', ')||'-'}</details>
        <details><summary>hall (${bp.related_halls.length})</summary>${bp.related_halls.map(t=>'<code>'+t+'</code>').join(', ')||'-'}</details>
        <details><summary>wing (${bp.related_wings.length})</summary>${bp.related_wings.map(t=>'<code>'+t+'</code>').join(', ')||'-'}</details>
        <details><summary>scenes (${bp.scenes.length})</summary>${bp.scenes.join(', ')||'-'}</details>
      </div>
      <div>
        <div class="card">
          <h2>关联图谱（Mermaid）</h2>
          <pre class="mermaid" id="graph-mmd">${mermaidSource(graph)}</pre>
        </div>
        <div class="card" style="margin-top:1rem">
          <h2>版本历史 (${(versions.versions||[]).length})</h2>
          ${(versions.versions||[]).map(v=>`<div>v${v.version} · ${v.changed_by} · ${(v.created_at||'').slice(0,16)} ${v.change_note?'· '+v.change_note:''}</div>`).join('')||'-'}
        </div>
      </div>
    </div>`;
  // Mermaid is loaded async below; render after import.
  if (window.mermaid) mermaid.run();
}

function mermaidSource(graph) {
  // graph.centre id may be "bp-xxx" — sanitize for mermaid.
  const safe = s => s.replace(/[^a-zA-Z0-9_]/g,'_');
  let lines = ['graph LR'];
  for (const n of graph.nodes) lines.push(`  ${safe(n.id)}["${n.kind}: ${n.label.replace(/"/g,"'")}"]`);
  for (const e of graph.edges) lines.push(`  ${safe(e.from)} -->|${e.label}| ${safe(e.To)}`);
  return lines.join('\n');
}

async function saveBP(id) {
  const body = $('#bp-body').value;
  try {
    const r = await api('/api/console/v2/bps/' + id, { method:'PUT', body: JSON.stringify({ body })});
    toast('保存成功，版本 = v' + r.version);
    location.hash = '/bp/' + id;
  } catch (e) { toast('保存失败: '+e.message, 'err'); }
}

async function publishBP(id) {
  try {
    await api('/api/console/v2/bps/' + id + '/publish', { method:'POST' });
    toast('已发布');
    location.hash = '/bp/' + id;
  } catch (e) { toast(e.message, 'err'); }
}

async function delBP(id) {
  // /api/console/v2/bps/:id 上没有 DELETE — 用 rate-limit reset 替身作为无害操作
  toast('删除 BP 需要 admin 权限（API 未暴露 DELETE，请走数据库）', 'err');
}

// ---- view: rate limit editor ----
async function renderRateLimit(path) {
  const params = new URLSearchParams(path.split('?')[1]||'');
  const focusTool = params.get('tool') || '';
  $('#app').innerHTML = `
    <h1>限流配置</h1>
    <div class="grid-2">
      <div class="card">
        <h2>已配置的工具</h2>
        <div id="rl-list">加载中…</div>
      </div>
      <div class="card">
        <h2>编辑：<code id="rl-tool">${focusTool||'(选择左侧工具)'}</code></h2>
        <div id="rl-form"></div>
      </div>
    </div>`;
  const list = await api('/api/console/v2/rate-limits');
  $('#rl-list').innerHTML = list.rate_limits.length
    ? list.rate_limits.map(r=>`<div style="cursor:pointer;padding:4px 6px;border-bottom:1px solid #f3f4f6"
            onclick="location.hash='/ratelimit?tool='+encodeURIComponent('${r.tool_id}')">
          <code>${r.tool_id}</code>
          <small style="opacity:.6"> · qps=${r.config.qps_per_user} qpm=${r.config.qpm_per_user} conc=${r.config.concurrency_global}</small>
        </div>`).join('')
    : '<p style="opacity:.6">暂无自定义限流配置（所有工具走默认值 5 qps / 60 qpm / 16 并发）</p>';

  if (focusTool) await loadRLForm(focusTool);
  else $('#rl-form').innerHTML = '<p style="opacity:.6">点击左侧工具或在工具目录里点任意 tool_id 来编辑限流。</p>';
}

async function loadRLForm(toolID) {
  const data = await api('/api/console/v2/tools/' + encodeURIComponent(toolID) + '/rate-limit');
  const cfg = data.config || {};
  $('#rl-tool').textContent = toolID;
  $('#rl-form').innerHTML = `
    <div class="row" style="gap:0.6rem;align-items:center">
      <label>qps_per_user <input id="qps" type=number value="${cfg.qps_per_user||5}" /></label>
      <label>qpm_per_user <input id="qpm" type=number value="${cfg.qpm_per_user||60}" /></label>
      <label>concurrency_global <input id="cg"  type=number value="${cfg.concurrency_global||16}" /></label>
      <label>queue_priority
        <select id="qp">
          ${['P0','P1','P2','P3','P4'].map(p=>`<option ${cfg.queue_priority===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </label>
      <label>cooldown_ms_after_error <input id="cd" type=number value="${cfg.cooldown_ms_after_error||1000}" /></label>
    </div>
    <div style="margin-top:0.6rem">
      <button class="primary" onclick="saveRL('${toolID}')">保存</button>
      <button class="danger" onclick="resetRL('${toolID}')">重置（用默认）</button>
      <button onclick="clearRLMem('${toolID}')">清空内存状态</button>
    </div>
    <p style="opacity:.6;font-size:12px;margin-top:0.6rem">保存后立即对下一次请求生效（不必重启 server）。清空内存状态强制让所有已有流也按新值计算。</p>`;
}

async function saveRL(toolID) {
  const cfg = {
    qps_per_user: parseInt($('#qps').value),
    qpm_per_user: parseInt($('#qpm').value),
    concurrency_global: parseInt($('#cg').value),
    queue_priority: $('#qp').value,
    cooldown_ms_after_error: parseInt($('#cd').value),
  };
  try {
    await api('/api/console/v2/tools/' + encodeURIComponent(toolID) + '/rate-limit',
      { method:'PUT', body: JSON.stringify(cfg) });
    toast('限流已更新');
  } catch (e) { toast('失败: '+e.message, 'err'); }
}

async function resetRL(toolID) {
  if (!confirm('重置为默认值？')) return;
  await api('/api/console/v2/tools/' + encodeURIComponent(toolID) + '/rate-limit', { method:'DELETE' });
  toast('已重置为默认');
  loadRLForm(toolID);
}

async function clearRLMem(toolID) {
  await api('/api/console/v2/tools/' + encodeURIComponent(toolID) + '/rate-limit/reset', { method:'POST' });
  toast('内存条目已清空');
}

// ---- boot ----
(async () => {
  try {
    const me = await api('/api/console/me');
    $('#status-pill').textContent = me?.user_id || '匿名';
  } catch (e) { $('#status-pill').textContent = '未登录'; }
  // mermaid via CDN
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload = () => { window.mermaid && mermaid.initialize({ startOnLoad: false }); };
  document.head.appendChild(s);
  go();
})();
</script>
</body>
</html>
