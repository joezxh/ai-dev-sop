# cbmem-team MySQL · docker-compose（开发环境）
#
# 仅供 cbmem-team v2 迁移期间本地开发使用。
# 生产部署请使用独立 MySQL 实例（专用账号 + utf8mb4 + binlog 7 天）。
#
# 启动：
#   cd tools/cbmem-team/deploy
#   docker compose -f docker-compose.mysql.yml up -d
#
# 验证：
#   mysql -h 127.0.0.1 -P 3306 -u cbmem -pcbmem-dev-password cbmem \
#     -e "SELECT @@version, @@character_set_server, @@collation_server;"
#
# 数据卷：./mysql-data（持久化）
# 重置：rm -rf ./mysql-data && docker compose -f docker-compose.mysql.yml up -d
version: "3.8"

services:
  cbmem-mysql:
    image: mysql:8.0
    container_name: cbmem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cbmem}
      MYSQL_USER: ${MYSQL_USER:-cbmem}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cbmem-dev-password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
      - --long-query-time=1
      - --slow-query-log=ON
      - --innodb-flush-log-at-trx-commit=2
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cbmem", "-pcbmem-dev-password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: