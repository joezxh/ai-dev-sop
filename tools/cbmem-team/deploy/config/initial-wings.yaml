# MemPalace 初始 Wing 配置
# 用于快速初始化团队 Wing 结构
#
# 使用方法:
#   1. 通过 Docker CLI:
#      docker compose --profile cli run mempalace-cli
#      然后在容器内执行以下命令
#
#   2. 或通过 MCP 工具自动创建

# ========== 团队共享 Wing ==========

# 团队共享知识库
mempalace create-wing \
  --name "team-shared" \
  --description "团队共享知识库 - 跨项目通用知识"

# API 设计规范
mempalace create-room \
  --wing "team-shared" \
  --name "api-standards" \
  --description "RESTful API 设计规范与标准"

# 架构决策
mempalace create-room \
  --wing "team-shared" \
  --name "architecture" \
  --description "架构决策记录 (ADR)"

# 最佳实践
mempalace create-room \
  --wing "team-shared" \
  --name "best-practices" \
  --description "开发最佳实践"

# 经验教训
mempalace create-room \
  --wing "team-shared" \
  --name "lessons-learned" \
  --description "失败案例与经验教训"

# ========== 后端团队 Wing ==========

mempalace create-wing \
  --name "team-backend" \
  --description "后端团队知识库"

mempalace create-room \
  --wing "team-backend" \
  --name "database-guidelines" \
  --description "数据库设计规范"

mempalace create-room \
  --wing "team-backend" \
  --name "incident-reports" \
  --description "生产事故报告与复盘"

mempalace create-room \
  --wing "team-backend" \
  --name "performance-tuning" \
  --description "性能调优经验"

# ========== 前端团队 Wing ==========

mempalace create-wing \
  --name "team-frontend" \
  --description "前端团队知识库"

mempalace create-room \
  --wing "team-frontend" \
  --name "component-library" \
  --description "组件库规范"

mempalace create-room \
  --wing "team-frontend" \
  --name "coding-style" \
  --description "编码风格指南"

# ========== Onboarding Wing ==========

mempalace create-wing \
  --name "onboarding" \
  --description "新人 Onboarding 知识库"

mempalace create-room \
  --wing "onboarding" \
  --name "getting-started" \
  --description "入门指南"

mempalace create-room \
  --wing "onboarding" \
  --name "tools-setup" \
  --description "工具安装配置"

mempalace create-room \
  --wing "onboarding" \
  --name "coding-standards" \
  --description "代码规范速查"
