# cbmem-team 测试用户配置
# 用于批量创建测试用户

# ========== 测试用户列表 ==========
# 使用方法:
# 1. 管理员登录 Console (http://192.168.100.83:8787/console/)
# 2. 在用户管理页面创建以下用户
# 或使用 API:
# curl -X POST http://192.168.100.83:8787/admin/users \
#   -H "X-Admin-Token: $ADMIN_TOKEN" \
#   -H "Content-Type: application/json" \
#   -d '{"id":"alice","display_name":"Alice","project_paths":["/code/foo"]}'

# ========== 用户定义 ==========

| 用户ID | 显示名称 | 项目路径 | 角色 | 用途 |
|--------|----------|----------|------|------|
| alice | Alice Wang | /code/foo | 开发者 | 主测试用户 |
| bob | Bob Chen | /code/bar | 开发者 | 协作测试 |
| carol | Carol Li | /code/foo | 开发者 | 权限测试 |
| admin | Admin | - | 管理员 | 管理账号 |

# ========== Token 发行脚本 ==========

#!/bin/bash
# 批量为测试用户发行 JWT Token

ADMIN_TOKEN="your-admin-token"
BASE_URL="http://192.168.100.83:8787"

# Alice
echo "=== Creating token for alice ==="
curl -sS -X POST "$BASE_URL/admin/users/alice/token?ttl=720h" \
  -H "X-Admin-Token: $ADMIN_TOKEN" | jq .

# Bob
echo "=== Creating token for bob ==="
curl -sS -X POST "$BASE_URL/admin/users/bob/token?ttl=720h" \
  -H "X-Admin-Token: $ADMIN_TOKEN" | jq .

# Carol
echo "=== Creating token for carol ==="
curl -sS -X POST "$BASE_URL/admin/users/carol/token?ttl=720h" \
  -H "X-Admin-Token: $ADMIN_TOKEN" | jq .

# ========== 项目配置 ==========
# 通过 Console 或 API 创建以下项目

| 项目名称 | 服务端路径 | Wing | 说明 |
|----------|------------|------|------|
| mediation-platform | /code/foo | team-backend | 主项目 |
| api-service | /code/bar | team-backend | API 服务 |
